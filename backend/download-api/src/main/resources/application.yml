server:
  port: ${PORT:8080}

datamart:
  graphql-url: ${DATAMART_GRAPHQL_URL:http://host.docker.internal:5000/graphql}
  timeout-seconds: ${DATAMART_TIMEOUT_SECONDS:30}

download:
  sync-threshold: ${DOWNLOAD_SYNC_THRESHOLD:10000}
  page-size: ${DOWNLOAD_PAGE_SIZE:1000}

  queue-name: ${DOWNLOAD_QUEUE_NAME:downloads}

  # Azure deployment settings
  storage-account-name: ${DOWNLOAD_STORAGE_ACCOUNT_NAME:}
  queue-client-id: ${DOWNLOAD_QUEUE_CLIENT_ID:}
  blob-client-id: ${DOWNLOAD_BLOB_CLIENT_ID:}
  blob-container-name: ${DOWNLOAD_BLOB_CONTAINER_NAME:downloads}
  sas-expiry-days: 7

  # Local development / Azurite
  queue-connection-string: ${DOWNLOAD_QUEUE_CONNECTION_STRING:}
  blob-connection-string: ${DOWNLOAD_BLOB_CONNECTION_STRING:}

  scheduler:
    enabled: ${DOWNLOAD_SCHEDULER_ENABLED:true}
    cron: ${DOWNLOAD_SCHEDULER_CRON:0 */5 * * * *}
    visibility-timeout-seconds: ${DOWNLOAD_QUEUE_VISIBILITY_TIMEOUT_SECONDS:300}

bc:
  notify:
    api-key: ${BC_NOTIFY_API_KEY:}
    email-endpoint: ${BC_NOTIFY_EMAIL_ENDPOINT:https://notify.digital.gov.bc.ca/api/v1/notifysimple/email}
    templates:
      download-success: ${BC_NOTIFY_DOWNLOAD_SUCCESS_TEMPLATE_ID:}
      download-failure: ${BC_NOTIFY_DOWNLOAD_FAILURE_TEMPLATE_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true