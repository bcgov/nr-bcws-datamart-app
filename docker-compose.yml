services:

  backend:
    container_name: backend
    build:
      context: ./backend/datamart-api
    image: ${BACKEND_IMAGE:-backend}
    env_file:
      - ./backend/datamart-api/.env
    ports:
      - "5000:5000"

  download-api:
    container_name: download-api
    build:
      context: ./backend/download-api
    environment:
      DATAMART_GRAPHQL_URL: http://backend:5000/graphql
      DOWNLOAD_QUEUE_NAME: downloads
      BC_NOTIFY_API_KEY: ${BC_NOTIFY_API_KEY:-}
      BC_NOTIFY_EMAIL_ENDPOINT: ${BC_NOTIFY_EMAIL_ENDPOINT:-https://notify.digital.gov.bc.ca/api/v1/notifysimple/email}
      BC_NOTIFY_DOWNLOAD_SUCCESS_TEMPLATE_ID: ${BC_NOTIFY_DOWNLOAD_SUCCESS_TEMPLATE_ID:-}
      BC_NOTIFY_DOWNLOAD_FAILURE_TEMPLATE_ID: ${BC_NOTIFY_DOWNLOAD_FAILURE_TEMPLATE_ID:-}
      DOWNLOAD_QUEUE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
      DOWNLOAD_SCHEDULER_ENABLED: "true"
      DOWNLOAD_SCHEDULER_CRON: "*/30 * * * * *"
      DOWNLOAD_QUEUE_VISIBILITY_TIMEOUT_SECONDS: "300"
      DOWNLOAD_BLOB_CONTAINER_NAME: downloads
      DOWNLOAD_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
      azurite:
        condition: service_started
      azurite-init:
        condition: service_completed_successfully

  azurite:
    container_name: azurite
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:5000
      VITE_DOWNLOAD_API_URL: http://download-api:8080
      VITE_PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: debug
    image: ${FRONTEND_IMAGE:-frontend}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started


  azurite-init:
    container_name: azurite-init
    image: mcr.microsoft.com/azure-cli

    depends_on:
      - azurite

    entrypoint:
      - sh
      - -c
      - |
        sleep 10

        az storage queue create \
          --name downloads \
          --connection-string "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
        az storage container create \
          --name downloads \
          --connection-string "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"