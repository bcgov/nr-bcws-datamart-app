<nrcl-filters-panel [showClear]="false">
    <nrcl-filter-date
        label="Start date"
        [value]="filter.startDate"
        (valueChange)="onStartDateChange( $event )"
        [max]="endDateLess1"
        [clear]="false"
    ></nrcl-filter-date>

    <nrcl-filter-date
        label="End date"
        [value]="filter.endDate"
        (valueChange)="onEndDateChange( $event )"
        [min]="startDatePlus1"
        [clear]="false" 
    ></nrcl-filter-date>

    <nrcl-filter-container
        label="Daily weather data"
        (click)="onDailyWeatherClick()"
    >
        <label>{{ dailyWeatherFieldCount }}</label>
        <nrcl-icon>chevron_right</nrcl-icon>
    </nrcl-filter-container>

    <nrcl-filter-container
        label="Hourly weather data"
        (click)="onHourlyWeatherClick()"
    >
        <label>{{ hourlyWeatherFieldCount }}</label>
        <nrcl-icon>chevron_right</nrcl-icon>
    </nrcl-filter-container>

    <nrcl-filter-container
        label="Station metadata"
        (click)="onStationMetadataClick()"
    >
        <label>{{ stationMetadataFieldCount }}</label>
        <nrcl-icon>chevron_right</nrcl-icon>
    </nrcl-filter-container>
</nrcl-filters-panel>
