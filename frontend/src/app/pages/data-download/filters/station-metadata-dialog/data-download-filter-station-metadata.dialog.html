<nrcl-dialog
    title="Station Metadata"
    [showClose]="true"
    [showWarning]="false"
    saveLabel="Apply changes"
    [saveEnabled]="true"
    (saveClick)="onSaveClick()"
    cancelLabel="Cancel"
    [cancelEnabled]="true"
    (cancelClick)="onCancelClick()"
>
    <p>
        <nrcl-button anchor
            label="Learn more about station metadata"
            iconRight="open_in_new"
        ></nrcl-button>
    </p>

    <data-download-filter-checkboxes
        headerTitle="Station metadata"
        [fields]="codeTableService.STATIONS_METADATA_COLUMNS.items"
        [value]="metadata"
        (valueChange)="onMetadataChange( $event )"
    ></data-download-filter-checkboxes>

    <nrcl-gap/>
</nrcl-dialog>
