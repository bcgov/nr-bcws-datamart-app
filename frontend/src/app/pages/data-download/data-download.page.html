<datamart-header #header>
    <section title>
        <h1>Weather data</h1>
    </section>

    <section actions>
        <nrcl-button anchor
            label="Add more stations"
            (click)="onAddMoreStationsClick()"
        ></nrcl-button>
    </section>
</datamart-header>

<nrcl-gap/>

<data-download-filters
    [filter]="filter"
    (filterChange)="onFilterChange( $event )"
></data-download-filters>

<nrcl-gap/>

<div class="tabs-container">
    <nrcl-tab-group standard>
        @if ( filter.dailyColumns.length == 0 && filter.hourlyColumns.length == 0 ) {
            <nrcl-tab label="Please select data columns" disabled>
            </nrcl-tab>
        }

        @if ( filter.dailyColumns.length > 0 ) {
            <nrcl-tab label="Daily Weather Data">
                <ng-template nrclTabContent>
                    <data-download-list-daily #list
                        [startDate]="filter.startDate"
                        [endDate]="filter.endDate"
                        [reportColumns]="dailyReportColumns"
                        (isLoadingChange)="header.isLoading = $event"
                    ></data-download-list-daily>
                </ng-template>
            </nrcl-tab>
        }

        @if ( filter.hourlyColumns.length > 0 ) {
            <nrcl-tab label="Hourly Weather Data">
                <ng-template nrclTabContent>
                    <data-download-list-hourly #list
                        [startDate]="filter.startDate"
                        [endDate]="filter.endDate"
                        [reportColumns]="hourlyReportColumns"
                        (isLoadingChange)="header.isLoading = $event"
                    ></data-download-list-hourly>
                </ng-template>
            </nrcl-tab>
        }
    </nrcl-tab-group>

    <div class="actions">
        <nrcl-button primary
            label="Download"
            icon="download"
        ></nrcl-button>

        <nrcl-button 
            label="Email download link"
            icon="email"
        ></nrcl-button>

        <nrcl-button 
            label="Copy link"
            icon="link"
            (click)="onCopyLinkClick()"
            [disabled]="!enableCopyLink"
            tooltip="Copy a link to this page with your current selections"
        ></nrcl-button>
    </div>
</div>
