<section class="station-selection-filters">
    <div class="filter-toolbar">
        <button
            type="button"
            class="filters-toggle-button"
            (click)="toggleFilters()">

            <span>
                Filters{{ activeFilterCount ? ' (' + activeFilterCount + ')' : '' }}
            </span>

            <nrcl-icon>
                {{ filtersExpanded ? 'expand_less' : 'expand_more' }}
            </nrcl-icon>
        </button>

        <nrcl-filter-search
            placeholder="Search stations"
            [value]="filter.search"
            (valueChange)="onSearchTextChange($event)">
        </nrcl-filter-search>
    </div>

    @if (filtersExpanded) {
        <div class="filters-outer-container">
            <div class="filters-inner-container">
                <nrcl-filters-panel class="filters-panel" [showClear]="false">
                    <nrcl-filter-select
                        label="Fire Centre"
                        [value]="filter.fireCentre"
                    ></nrcl-filter-select>

                    <nrcl-filter-select
                        label="Fire Zone"
                        [value]="filter.fireZone"
                    ></nrcl-filter-select>

                    <nrcl-filter-select
                        label="Station Status"
                        [value]="filter.stationStatus"
                    ></nrcl-filter-select>

                    <div class="range-filter-group">
                        <div class="range-filter-title">
                            Elevation (m)
                        </div>

                        <div class="range-filter-row">
                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Min
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. 500"
                                    [value]="filter.elevation[0]"
                                    (change)="onElevationChange( $event?.target?.value, filter.elevation[1] )"
                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>

                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Max
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. 1,500"
                                    [value]="filter.elevation[1]"
                                    (change)="onElevationChange( filter.elevation[0], $event?.target?.value )"
                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="range-filter-group">
                        <div class="range-filter-title">
                            Latitude (decimal degrees)
                        </div>

                        <div class="range-filter-row">
                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Min
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. 49.25"
                                    [value]="filter.latitude[0]"
                                    (change)="onLatitudeChange( $event?.target?.value, filter.latitude[1] )"

                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>

                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Max
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. 55.00"
                                    [value]="filter.latitude[1]"
                                    (change)="onLatitudeChange( filter.latitude[0], $event?.target?.value )"
                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>
                        </div>
                    </div>

                    <div class="range-filter-group">
                        <div class="range-filter-title">
                            Longitude (decimal degrees)
                        </div>

                        <div class="range-filter-row">
                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Min
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. -130.00"
                                    [value]="filter.longitude[0]"
                                    (change)="onLongitudeChange( $event?.target?.value, filter.longitude[1] )"
                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>

                            <div class="range-filter-field">
                                <label class="range-filter-label">
                                    Max
                                </label>

                                <input
                                    type="number"
                                    placeholder="e.g. -120.00"
                                    [value]="filter.longitude[1]"
                                    (change)="onLongitudeChange( filter.longitude[0], $event?.target?.value )"
                                    (blur)="applyFilters()"
                                    (keydown.enter)="applyFilters()"
                                >
                            </div>
                        </div>
                    </div>
                </nrcl-filters-panel>

                <div class="filter-actions">
                    @if (isMobileView) {
                        <nrcl-button primary
                            (click)="toggleFilters()">
                            Apply filters
                        </nrcl-button>
                    }
    
                    <button type="button"
                        class="clear-filters-button"
                        (click)="onClearSearchAndFilters()">
                        Clear filters
                    </button>
                </div>
            </div>
        </div>
    }
</section>
