<nrcl-filters-panel 
    (clearFilters)="onClearFilters()"
    [hasAdvancedFilters]="true"
    [showAdvancedFilters]="false"
    [moreFiltersLabels]="['Show Filters','Hide Filters']"
>
    <nrcl-filter-search
        placeholder="Search stations"
        [value]="filter.search"
        (valueChange)="onSearchTextChange($event)">
    </nrcl-filter-search>

    <nrcl-filter-select advanced 
        label="Fire centre"
        [value]="filter.fireCentre"
        [options]="codeTableService.FIRE_CENTRES.items"
        [summary]="false"
        (valueChange)="onFireCentreChange( $event )"
    ></nrcl-filter-select>

    <nrcl-filter-select advanced 
        label="Fire zone"
        [value]="filter.fireZone"
        [options]="fireZoneOptions!"
        [summary]="false"
        (valueChange)="onFireZoneChange( $event )"
    ></nrcl-filter-select>

    <nrcl-filter-select advanced 
        label="Station status"
        [value]="filter.stationStatus"
        [options]="codeTableService.WEATHER_STATION_STATUS.items"
        [summary]="false"
        [filter]="false"
        (valueChange)="onStationStatusChange( $event )"
    ></nrcl-filter-select>

    <div advanced style="width:100%"></div>

    <nrcl-filter-container advanced wide="3"
        label="Elevation (m)"
    >
        <label>Min:
            <input type="number" matInput
                placeholder="e.g. 500"
                [value]="filter.elevation[0]"
                (change)="onElevationChange( $event?.target?.value, filter.elevation[1] )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>

        <label>Max:
            <input type="number"
                placeholder="e.g. 1,500"
                [value]="filter.elevation[1]"
                (change)="onElevationChange( filter.elevation[0], $event?.target?.value )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>
    </nrcl-filter-container>

    <nrcl-filter-container advanced wide="3"
        label="Latitude (degrees)"
    >
        <label>Min:
            <input type="number"
                placeholder="e.g. 49.25"
                [value]="filter.latitude[0]"
                (change)="onLatitudeChange( $event?.target?.value, filter.latitude[1] )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>

        <label>Max:
            <input type="number"
                placeholder="e.g. 55.00"
                [value]="filter.latitude[1]"
                (change)="onLatitudeChange( filter.latitude[0], $event?.target?.value )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>
    </nrcl-filter-container>

    <nrcl-filter-container advanced wide="3"
        label="Longitude (degrees)"
    >
        <label>Min:
            <input type="number"
                placeholder="e.g. -130.00"
                [value]="filter.longitude[0]"
                (change)="onLongitudeChange( $event?.target?.value, filter.longitude[1] )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>

        <label>Max:
            <input type="number"
                placeholder="e.g. -120.00"
                [value]="filter.longitude[1]"
                (change)="onLongitudeChange( filter.longitude[0], $event?.target?.value )"
                (blur)="applyFilters()"
                (keydown.enter)="applyFilters()"
            >
        </label>
    </nrcl-filter-container>
</nrcl-filters-panel>
