
<div class="header">
    <div class="description">{{ listDescription }}</div>

    <mat-checkbox class="select-all"
        [checked]="areAllSelected"
        (change)="onSelectAllClick()"
    >
        Select all
    </mat-checkbox>

    <nrcl-button tertiary
        [label]="sortButton"
        [attr.aria-label]="sortLabel"
        [matMenuTriggerFor]="sortMenu"
        iconRight="expand_more"
    ></nrcl-button>

    <mat-menu #sortMenu="matMenu" class="station-sorting-menu">
        <nrcl-button tertiary        
            label="Name (A-Z)"
            (click)="setSort('nameAsc')"
        ></nrcl-button>
        
        <nrcl-button tertiary 
            label="Name (Z-A)"
            (click)="setSort('nameDesc')"
        ></nrcl-button>
        
        <nrcl-button tertiary 
            label="Code (Low-High)"
            (click)="setSort('codeAsc')"
        ></nrcl-button>
        
        <nrcl-button tertiary 
            label="Code (High-Low)"
            (click)="setSort('codeDesc')"
        ></nrcl-button>
    </mat-menu>
</div>

<div class="list">
    @for ( station of sortedStations; track station.properties.WEATHER_STATION_GUID ) {
        <div class="station"
            (click)="onStationSelectClick(station)"
        >
            <mat-checkbox
                [checked]="isSelected(station)"
            ></mat-checkbox>

            <div class="content">
                <span>
                    <nrcl-button anchor tabindex="0"
                        [label]="station.properties.STATION_NAME"
                        [attr.aria-label]="'View details for station ' + station.properties.STATION_NAME"
                        (click)="onStationNameClick( station ); $event.stopPropagation()"
                        (keyup.enter)="onStationNameClick( station ); $event.stopPropagation()"
                    ></nrcl-button>
                </span>

                <div class="details">
                    <span>
                        Station code: {{ station.properties.STATION_CODE || '\u2014' }}
                    </span>

                    <span>
                        Acronym: {{ station.properties.STATION_ACRONYM || '\u2014' }}
                    </span>
                </div>
            </div>
        </div>
    }
</div>
