<datamart-header>
    <section title>
        <h1>Select weather stations</h1>
        <p>Choose one or more stations to view weather data.</p>
    </section>

    <section actions>
        <nrcl-button primary
            label="View data"
            (click)="onViewDataClick()"
            iconRight="arrow_forward"
        ></nrcl-button>
    </section>
</datamart-header>
    
<station-selection-filters></station-selection-filters>

<nrcl-device-view class="content">
    <ng-template desktop-view>
        <section class="station-selection-content">
            <station-selection-content-list
                (identifyStation)="map.identifyStation( $event )"
            ></station-selection-content-list>

            <station-selection-content-map #map>
            </station-selection-content-map>
        </section>
    </ng-template>

    <ng-template mobile-view>
        <section class="station-selection-mobile">
            <nrcl-tab-group standard stretched>
                <nrcl-tab label="Find in List">
                    <ng-template nrclTabLabel>
                        <nrcl-icon>list</nrcl-icon>
                        Find in List
                    </ng-template>

                    <station-selection-content-list></station-selection-content-list>
                </nrcl-tab>
                
                <nrcl-tab label="Find in Map">
                    <ng-template nrclTabLabel>
                        <nrcl-icon>location_on</nrcl-icon>
                        Find in Map
                    </ng-template>

                    <ng-template nrclTabContent>
                        <station-selection-content-map></station-selection-content-map>
                    </ng-template>
                </nrcl-tab>
            </nrcl-tab-group>
        </section>
    </ng-template>
</nrcl-device-view>
