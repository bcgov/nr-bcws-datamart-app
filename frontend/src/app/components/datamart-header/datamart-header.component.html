<div class="title">
    <ng-content select="section[title]"></ng-content>
</div>

<div class="actions">
    <nrcl-button tertiary class="selected-stations-button"
        [label]="selectedStationsLabel"
        (click)="onStationsSelectedClick()"
        iconRight="chevron_right"
    ></nrcl-button>

    <ng-content select="section[actions]"></ng-content>
</div>

<div class="status">
    @if ( isLoading ) {
        <mat-spinner class="loading" [diameter]="30"></mat-spinner>
    }
</div>
