<section class="station-selection-filters">

    <div class="filter-toolbar">

        <button
            type="button"
            class="filters-toggle-button"
            (click)="toggleFilters()">

           <span>
                Filters{{ activeFilterCount ? ' (' + activeFilterCount + ')' : '' }}
            </span>

            <nrcl-icon>
                {{ filtersExpanded ? 'expand_less' : 'expand_more' }}
            </nrcl-icon>

        </button>

        <nrcl-filter-search
            placeholder="Search stations">
        </nrcl-filter-search>

    </div>

    @if (filtersExpanded) {

        <div class="filters-outer-container">

            <div class="filters-inner-container">

                <nrcl-filters-panel class="filters-panel" [showClear]="false">

                    <nrcl-filter-select
                        label="Fire Centre">
                    </nrcl-filter-select>

                    <nrcl-filter-select
                        label="Fire Zone">
                    </nrcl-filter-select>

                    <nrcl-filter-select
                        label="Station Status">
                    </nrcl-filter-select>

                    <nrcl-filter-container label="Elevation (m)">
                        <div class="range-filter-content">
                            <input
                                type="number"
                                placeholder="e.g. 500"
                                [(ngModel)]="elevationMin"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">

                            <span>-</span>

                            <input
                                type="number"
                                placeholder="e.g. 1,500"
                                [(ngModel)]="elevationMax"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">
                        </div>
                    </nrcl-filter-container>

                    <nrcl-filter-container label="Latitude (decimal degrees)">
                        <div class="range-filter-content">
                            <input
                                type="number"
                                placeholder="e.g. 49.25"
                                [(ngModel)]="latitudeMin"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">

                            <span>-</span>

                            <input
                                type="number"
                                placeholder="e.g. 55.00"
                                [(ngModel)]="latitudeMax"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">
                        </div>
                    </nrcl-filter-container>

                    <nrcl-filter-container label="Longitude (decimal degrees)">
                        <div class="range-filter-content">
                            <input
                                type="number"
                                placeholder="e.g. -130.00"
                                [(ngModel)]="longitudeMin"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">

                            <span>-</span>

                            <input
                                type="number"
                                placeholder="e.g. -120.00"
                                [(ngModel)]="longitudeMax"
                                (blur)="applyFilters()"
                                (keydown.enter)="applyFilters()">
                        </div>
                    </nrcl-filter-container>

                </nrcl-filters-panel>
                <div class="filter-actions">

                    @if (isMobileView) {
                    <nrcl-button primary
                            (click)="toggleFilters()">
                            Apply filters
                    </nrcl-button>
                    }
                    <button type="button"
                        class="clear-filters-button"
                        (click)="clearFilters()">
                        Clear filters
                    </button>

                </div>

            </div>

        </div>

    }

</section>
