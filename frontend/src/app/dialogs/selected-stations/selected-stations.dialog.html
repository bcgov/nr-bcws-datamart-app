<nrcl-dialog
    title="Selected stations"
    [showClose]="true"
    [showWarning]="false"
    [saveEnabled]="null"
    cancelLabel="Close"
    [cancelEnabled]="true"
    (cancelClick)="onCancelClick()"
>
    @if (selectedCount === 0) {
        <div class="empty-state">
            <h3>No stations selected</h3>

            <p class="dialog-message">
                Select stations from the map or station list.
                Your selections will appear here.
            </p>
        </div>
    } 
    @else {
        <div class="header">
            <h3>
                {{ selectedCount }}
                {{ selectedCount === 1 ? 'station' : 'stations' }}
                selected
            </h3>

            <nrcl-button class="remove-action"
                label="Remove all"
                (click)="onRemoveAllClick(); list.refreshRowList()"
            ></nrcl-button>
        </div>

        <nrcl-gap/>

        <selected-stations-list #list></selected-stations-list>
    }    
</nrcl-dialog>
